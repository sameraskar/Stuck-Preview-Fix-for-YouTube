name: Feature request
description: Suggest a narrowly related compatibility or reliability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What stuck-preview case is not currently handled?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep requests within the extension's single purpose.
    validations:
      required: true
