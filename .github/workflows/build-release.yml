name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project
        run: python scripts/validate.py

      - name: Build extension
        run: python scripts/build.py

      - name: Extract version from manifest
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "Release version: ${version}"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages/*.zip
          retention-days: 5

      - name: Check if tag already exists
        id: check_tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "${tag}" | grep -q "${tag}"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Stuck Preview Fix ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Generate release notes
        id: release_notes
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "Generating release notes from commits..."
          notes=""
          # Get commits since last tag or all commits if no tags exist
          if git describe --tags --abbrev=0 2>/dev/null; then
            commits=$(git log --pretty=format:"- %s (%h)" "$(git describe --tags --abbrev=0)..HEAD")
          else
            commits=$(git log --pretty=format:"- %s (%h)" --reverse)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${commits}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = "${{ steps.version.outputs.version }}";
            const tag = `v${version}`;
            const body = `${{ steps.release_notes.outputs.notes }}`;
            
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Stuck Preview Fix ${version}`,
              body: body,
              draft: false,
              prerelease: false
            });
            
            console.log(`Created release: Stuck Preview Fix ${version}`);

      - name: Upload release assets
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ steps.version.outputs.version }}
          for file in dist/packages/*.zip; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload "v${version}" "$file" --clobber
          done
